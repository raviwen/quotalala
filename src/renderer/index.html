<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'">
  <title>Quotalala</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="team-room.css">
</head>
<body>
  <div class="workspace">
    <aside class="history-sidebar">
      <div class="sidebar-brand"><div class="logo-icon">q.</div><strong>Quotalala</strong><span class="local-dot" title="Local"></span></div>
      <button id="chooseFolderBtn" class="project-picker"><span class="folder-mark">▱</span><span><small data-i18n="activeProject"></small><strong id="sidebarProjectName"></strong></span><span class="picker-chevron">⌄</span></button>
      <select id="recentProjects" aria-label="Projects"><option value="" data-i18n="switchProject"></option></select>
      <button id="newSessionBtn" class="new-session"><span>＋</span><span data-i18n="newSession"></span><kbd>Ctrl N</kbd></button>
      <div class="history-heading"><span data-i18n="history"></span><span id="historyCount">0</span></div>
      <div id="historyList"></div>
      <div class="sidebar-bottom"><span class="sidebar-local"><span class="local-dot"></span><span data-i18n="localOnly"></span></span><button id="settingsBtn" class="btn-ghost" data-i18n="settings"></button></div>
    </aside>
    <main class="app-container">
      <header class="app-header">
        <div class="breadcrumb"><span data-i18n="workspaceLabel"></span><span class="crumb-divider">/</span><strong id="projectName"></strong></div>
        <div class="header-actions"><span id="systemHealthBadge" class="status-pill"></span><div class="lang-switcher"><button id="langTr" class="lang-btn active">TR</button><button id="langEn" class="lang-btn">EN</button></div></div>
      </header>
      <div class="content-layout">
        <div class="main-column">
          <section class="workspace-intro"><div class="eyebrow" data-i18n="workTogether"></div><h1 data-i18n="workspaceTitle"></h1><p data-i18n="workspaceSubtitle"></p></section>
          <section class="agents-section">
            <div class="section-header"><h2 data-i18n="yourAgents"></h2><button id="runAllHealthBtn" class="btn-ghost" data-i18n="runAllHealth"></button></div>
            <section id="teamRoom" class="team-room" aria-labelledby="roomTitle">
              <div class="room-heading"><div><span class="room-eyebrow" data-i18n="roomEyebrow"></span><h2 id="roomTitle" data-i18n="roomTitle"></h2></div><div class="room-heading-actions"><span id="roomStatus" role="status" aria-live="polite"></span><button id="toggleRoomBtn" class="btn-ghost" aria-expanded="true" aria-controls="roomBody" data-i18n="roomCollapse"></button></div></div>
              <div id="roomBody"><div id="roomScene" class="office-scene" role="group" data-i18n-aria="roomSceneLabel"></div>
              <div id="roomDelivery" class="room-delivery"><span class="delivery-dot" aria-hidden="true"></span><button id="roomLatestMessage" class="btn-ghost" disabled><span id="roomRouteText" data-i18n="roomNoMessages"></span><span aria-hidden="true">↗</span></button><small data-i18n="roomLocal"></small></div>
              <section id="roomMessageDetails" class="room-message-details selectable" tabindex="0" hidden><div class="section-header"><strong id="roomMessageTitle"></strong><button id="closeRoomMessageBtn" class="btn-ghost" data-i18n="close"></button></div><div id="roomMessageBody"></div></section></div>
            </section>
            <details id="agentCardsDetails" class="agent-cards-details"><summary data-i18n="roomConnectionDetails"></summary><div id="agentsGrid" class="agents-grid"></div></details>
          </section>
          <section class="prompt-section">
            <div class="prompt-box-card">
              <div class="composer-heading"><label for="promptInput" data-i18n="promptLabel"></label><span id="sessionLabel" class="session-label"></span></div>
              <textarea id="promptInput" rows="3" data-i18n-placeholder="promptPlaceholder"></textarea>
              <div class="run-controls">
                <label><span data-i18n="runMode"></span><select id="runMode"><option value="coordinated" data-i18n="coordinated"></option><option value="economic" data-i18n="economic"></option></select></label>
                <span id="economicControls" style="display:contents;" hidden>
                  <label><span data-i18n="agent"></span><select id="directAgent"><option value="codex">Codex</option><option value="claude">Claude</option><option value="gemini">Gemini</option></select></label>
                  <label><span data-i18n="level"></span><select id="directLevel"><option value="hafif" data-i18n="hafif"></option><option value="orta" data-i18n="orta"></option><option value="güçlü" data-i18n="güçlü"></option></select></label>
                </span>
                <label><span data-i18n="timeoutSeconds"></span><input id="timeoutSeconds" type="number" min="1" max="1800" value="180"></label>
                <label><input id="previewPlan" type="checkbox"><span data-i18n="previewPlan"></span></label>
                <label><input id="verifyRun" type="checkbox"><span data-i18n="verifyRun"></span></label>
              </div>
              <p id="directHint" class="muted" data-i18n="directHint"></p>
              <div class="composer-footer">
                <span class="composer-context"><span class="folder-mark">▱</span><span id="composerProjectName"></span><span class="context-separator">·</span><span data-i18n="memoryIncluded"></span></span>
                <div class="composer-actions">
                  <span id="agentQuotaWarning" class="agent-quota-warning" role="alert" hidden data-i18n="agentQuotaLimitedWarning">Seçili ajanın kotası dolu; görev kota bekleyecek.</span>
                  <button id="planAndExecuteBtn" class="btn btn-accent" data-i18n="addTask">Ekle</button>
                  <button id="stopBtn" class="btn btn-secondary" data-i18n="stop" disabled></button>
                </div>
              </div>
              <input id="cwdInput" type="hidden">
            </div>
            <p id="projectPath" class="project-path"></p>
          </section>
          <section class="logs-section">
            <div class="tabs-header">
              <div class="tabs-list"><button class="tab-btn active" data-tab="boardTab" data-i18n="tabBoard"></button><button class="tab-btn" data-tab="liveStreamTab" data-i18n="tabLiveStream"></button><button class="tab-btn" data-tab="timelineTab" data-i18n="activityHeading"></button><button class="tab-btn" data-tab="terminalLogTab" data-i18n="tabTerminalLog"></button></div>
              <div class="tab-actions"><button id="copyAllBtn" class="btn-ghost" data-i18n="copyAll"></button><button id="clearLogsBtn" class="btn-ghost" data-i18n="clearLogs"></button></div>
            </div>
            <div id="boardTab" class="tab-content active">
              <div class="board-container">
                <div id="boardList" class="board-list selectable" tabindex="0"></div>
                <div id="boardDetailModal" class="board-detail-container selectable" tabindex="0" hidden>
                  <div class="section-header">
                    <h3 id="boardDetailTitle"></h3>
                    <button id="boardDetailCloseBtn" class="btn-ghost" data-i18n="close">✕</button>
                  </div>
                  <div id="boardDetailBody"></div>
                </div>
              </div>
            </div>
            <div id="liveStreamTab" class="tab-content"><div id="streamContainer" class="stream-container selectable" tabindex="0"></div></div>
            <div id="timelineTab" class="tab-content"><section id="timelineContainer" class="activity-timeline selectable" tabindex="0" hidden></section><div id="timelineEmpty" class="stream-empty" data-i18n="timelinePlaceholder"></div></div>
            <div id="terminalLogTab" class="tab-content">
              <div class="filter-bar" id="levelFilters"><button data-level="all" class="active" data-i18n="all"></button><button data-level="error" data-i18n="errors"></button><button data-level="warning" data-i18n="warnings"></button><select id="agentFilter"><option value="all" data-i18n="allAgents"></option><option value="claude">Claude</option><option value="codex">Codex</option><option value="gemini">Gemini</option></select></div>
              <div id="terminalWindow" class="terminal-window selectable" tabindex="0"></div><div id="errorCards" class="error-cards selectable" tabindex="0"></div>
            </div>
          </section>
        </div>
        <aside class="context-panel">
          <div class="context-header"><span class="context-symbol">◈</span><h2 data-i18n="contextTitle"></h2></div>
          <div class="context-project"><span data-i18n="activeProject"></span><strong id="contextProjectName"></strong><p data-i18n="projectContextHint"></p></div>
          <details id="memoryDetails" open><summary data-i18n="projectMemory"></summary><p class="memory-hint" data-i18n="memoryHint"></p><div class="input-group"><textarea id="memoryInput" rows="9" maxlength="2000" data-i18n-placeholder="memoryPlaceholder"></textarea></div><div class="memory-actions"><span id="memoryCount">0/2000</span><button id="saveMemoryBtn" class="btn btn-secondary" data-i18n="save"></button></div><button id="resetMemoryBtn" class="btn-ghost reset-memory" data-i18n="resetMemory"></button></details>
          <div class="context-note"><span class="note-mark">↗</span><p data-i18n="coordinationHint"></p></div>
          <div class="privacy-note"><span class="local-dot"></span><p data-i18n="localHistoryHint"></p></div>
        </aside>
      </div>
      <div id="notice" role="status" aria-live="polite"></div>
    </main>
  </div>
  <dialog id="settingsDialog">
    <div class="section-header"><h2 data-i18n="settings"></h2><button id="closeSettingsBtn" class="btn-ghost" data-i18n="close"></button></div>
    <label class="setting-toggle"><input type="checkbox" id="saveHistoryInput"><span data-i18n="saveHistory"></span></label>
    <label class="setting-toggle"><input type="checkbox" id="notificationsInput"><span data-i18n="taskNotifications"></span></label>
    <label class="setting-toggle"><input type="checkbox" id="autoMergeInput"><span data-i18n="autoMergeLabel">Onaylanan görevleri otomatik birleştir</span></label>
    <div class="setting-row">
      <label for="coordinatorModelSelect" data-i18n="coordinatorModelLabel">Koordinatör Claude Modeli:</label>
      <select id="coordinatorModelSelect" class="setting-select">
        <option value="opus">Claude Opus (En Güçlü)</option>
        <option value="sonnet">Claude Sonnet (Dengeli)</option>
        <option value="haiku">Claude Haiku (Hafif/Hızlı)</option>
      </select>
    </div>
    <details id="limitsDetails">
      <summary data-i18n="limitsLabel">Görev Bütçeleri</summary>
      <p data-i18n="limitsHint"></p>
      <div class="limits-grid">
        <label class="limit-field"><span data-i18n="limitSubtasks"></span><input type="number" id="limitSubtasks" min="1" max="20"></label>
        <label class="limit-field"><span data-i18n="limitAttempts"></span><input type="number" id="limitAttempts" min="1" max="5"></label>
        <label class="limit-field"><span data-i18n="limitReplies"></span><input type="number" id="limitReplies" min="0" max="5"></label>
        <label class="limit-field"><span data-i18n="limitRounds"></span><input type="number" id="limitRounds" min="1" max="8"></label>
        <label class="limit-field"><span data-i18n="limitCalls"></span><input type="number" id="limitCalls" min="5" max="60"></label>
      </div>
    </details>
    <p data-i18n="taskNotificationsHint"></p><p data-i18n="privacyHint"></p>
    <button id="clearHistoryBtn" class="btn btn-secondary" data-i18n="clearHistory"></button>
    <details open id="modelsDetails">
      <summary data-i18n="modelSettings"></summary>
      <p data-i18n="modelHint"></p>
      <div id="modelsTableContainer" class="models-table-wrapper">
        <table id="modelsTable" class="models-table">
          <thead>
            <tr>
              <th data-i18n="modelColAgent">Ajan</th>
              <th data-i18n="modelColName">Ad</th>
              <th data-i18n="modelColDisplayName">Görünen ad</th>
              <th data-i18n="modelColLevel">Seviye</th>
              <th data-i18n="modelColThinking">Düşünme</th>
              <th data-i18n="modelColCost">Maliyet</th>
              <th data-i18n="modelColPreview">Preview</th>
              <th data-i18n="modelColSource">Kaynak</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="modelsTableBody"></tbody>
        </table>
        <div class="models-table-actions">
          <button id="addModelRowBtn" type="button" class="btn btn-secondary btn-sm" data-i18n="addModelRow">Satır ekle</button>
          <button id="toggleRawModelsBtn" type="button" class="btn-ghost" data-i18n="showAsJSON">JSON olarak göster</button>
        </div>
      </div>
      <div id="modelsRawContainer" class="input-group" hidden>
        <textarea id="modelsInput" rows="12"></textarea>
      </div>
      <datalist id="claudeModelsList">
        <option value="haiku">Claude Haiku (Hafif)</option>
        <option value="sonnet">Claude Sonnet (Orta)</option>
        <option value="opus">Claude Opus (Güçlü)</option>
      </datalist>
      <datalist id="codexModelsList">
        <option value="gpt-6-luna">GPT-6 Luna (Hafif)</option>
        <option value="gpt-6.1-sol">GPT-6.1 Sol (Orta)</option>
        <option value="gpt-6-astra">GPT-6 Astra (Güçlü)</option>
      </datalist>
      <datalist id="geminiModelsList">
        <option value="gemini-3.8-flash-low">Gemini 3.8 Flash Low (Hafif)</option>
        <option value="gemini-3.8-flash-medium">Gemini 3.8 Flash Medium (Orta)</option>
        <option value="gemini-3.8-flash-high">Gemini 3.8 Flash High (Güçlü)</option>
      </datalist>
      <div id="modelsTableError" class="models-error-msg" role="alert" hidden></div>
      <div class="models-save-bar">
        <button id="saveModelsBtn" class="btn btn-secondary" data-i18n="saveModels"></button>
      </div>
    </details>
  </dialog>
  <dialog id="planDialog"><h2 data-i18n="previewPlan"></h2><p data-i18n="editPlanHint"></p><div id="planEditor"></div><p id="planError" role="alert"></p><button id="approvePlanBtn" class="btn btn-accent" data-i18n="approvePlan"></button><button id="cancelPlanBtn" class="btn btn-secondary" data-i18n="stop"></button></dialog>
  <script src="log-model.js"></script><script src="../shared/activity.js"></script><script src="../shared/team-room.js"></script><script src="team-room-view.js"></script><script src="app.js"></script>
</body>
</html>
